[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notion-cli"
version = "0.1.0"
description = "Notion CLI for AI agents - built on ultimate-notion"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["notion", "cli", "ai", "agent"]
authors = [
    {name = "Christian Chen", email = "christianchen01@gmail.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Utilities",
    "Typing :: Typed",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "typer>=0.16.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "ultimate-notion>=0.5.0",
    "tabulate>=0.9.0",
    "numpy>=1.24.0",
    "emoji>=2.8.0",
    "tomli>=2.2.0",
    "pydantic>=2.0.0",
    "mistune>=3.0.0",
    "packaging>=23.0",
    "pendulum>=3.0.0",
    "typing_extensions>=4.0.0",
    "tomli_w>=1.2.0",
    "url-normalize>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "pytest-recording>=0.13.1",
    "vcrpy>=5.1.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
    "coverage>=7.3.0",
]

[project.scripts]
notion = "notion_cli.cli:app"

[project.urls]
Homepage = "https://github.com/chen-gdp/notion-cli"
Source = "https://github.com/chen-gdp/notion-cli"

[tool.hatch.build.targets.wheel]
packages = ["src/notion_cli"]

# UV configuration
[tool.uv]
python = ">=3.10"

[tool.uv.dev-dependencies]
pytest = ">=7.4.0"
pytest-cov = ">=4.1.0"
pytest-mock = ">=3.11.0"
pytest-recording = ">=0.13.1"
vcrpy = ">=5.1.0"
mypy = ">=1.5.0"
ruff = ">=0.1.0"
coverage = ">=7.3.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=src/notion_cli",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=100",
    "-v",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests with VCR",
    "slow: Slow tests",
]

[tool.coverage.run]
branch = true
source = ["src/notion_cli"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/vendor/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # Line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint.isort]
known-first-party = ["notion_cli"]
